[package]
name = "novafig-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NovaFig renderer: the scene graph to pixels on tiny-skia (fills, gradients, images, aligned strokes, shadows, blurs, masks, blend modes, text)"

[lints]
