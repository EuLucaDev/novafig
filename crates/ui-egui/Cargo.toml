[package]
name = "novafig-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NovaFig egui frontend (the Figma-style UI: canvas, toolbar, layers, design and prototype panels, menus); swappable: nothing below depends on it"

[lints]
workspace = true

[dependencies]
novafig-geom = { workspace = true }
novafig-color = { workspace = true }
novafig-doc = { workspace = true }
novafig-text = { workspace = true }
novafig-layout = { workspace = true }
novafig-render = { workspace = true }
novafig-pathops = { workspace = true }
novafig-engine = { workspace = true }
novafig-format = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
egui_extras = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"

[dev-dependencies]
wat = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nova-live = { git = "https://github.com/EuLucaDev/nova-live", rev = "25720ad8a7aa8cc6e10ffd13091bd69873d9fd95" }
nova-account-ui = { git = "https://github.com/EuLucaDev/nova-live", rev = "25720ad8a7aa8cc6e10ffd13091bd69873d9fd95" }
